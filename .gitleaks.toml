title = "Vowora secret scan"
[extend]
useDefault = true
[[allowlists]]
description = "Generated dependency lockfile and placeholder environment template"
paths = [
  '''^package-lock\.json$''',
  '''^\.env\.example$''',
]

[[allowlists]]
description = "Readdy-synced .env: the public Supabase anon key only (also enforced by scripts/check-repository.mjs)"
condition = "AND"
paths = ['''^\.env$''']
regexTarget = "line"
regexes = ['''^VITE_PUBLIC_SUPABASE_ANON_KEY\s*=\s*["']?(eyJ[\w-]+\.[\w-]+\.[\w-]+|sb_publishable_[\w-]+)["']?\s*$''']

[[allowlists]]
description = "This project's intentionally public Supabase publishable browser key"
condition = "AND"
paths = ['''^src/lib/publicSupabaseConfig\.ts$''']
regexTarget = "secret"
regexes = ['''^sb_publishable_[A-Za-z0-9_-]+$''']
