name: Prepare Readdy release
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    name: Verify and package one Readdy handoff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_DEMO_MODE: 'false'
      VITE_PUBLIC_SITE_URL: https://vowora.uk
      VITE_PUBLIC_SUPABASE_URL: ${{ vars.VITE_PUBLIC_SUPABASE_URL }}
      VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_ANON_KEY }}
      VITE_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-repository.mjs
      - run: node scripts/validate-environment.mjs production
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run test:database
      - run: npm run check:edge
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Record exact handoff commit
        run: git rev-parse HEAD > out/release-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vowora-readdy-handoff
          path: |
            out/
            supabase/
            docs/RELEASE-HANDOFF.md
            docs/THREE-PHASE-BUILD.md
      - name: Handoff status
        run: echo "Package prepared. This workflow does not deploy Supabase or publish Readdy. Follow docs/RELEASE-HANDOFF.md once."
