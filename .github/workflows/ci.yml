name: Vowora CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  VITE_DEMO_MODE: 'false'
  VITE_PUBLIC_SITE_URL: https://vowora.uk
  VITE_PUBLIC_SUPABASE_URL: https://example.supabase.co
  VITE_PUBLIC_SUPABASE_ANON_KEY: eyJ-ci-placeholder
  VITE_RELEASE_VERSION: ci
jobs:
  checks:
    name: Types, lint, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-repository.mjs
      - run: npm run type-check
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build
      - run: node scripts/validate-environment.mjs production
      - uses: actions/upload-artifact@v4
        with:
          name: verified-frontend
          path: out/
  backend:
    name: Database journeys and Edge Function types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:database
      - run: npm run check:edge
  browser:
    name: Production browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
      - name: Verify secret scanner detects a synthetic canary
        run: |
          set +e
          node -e 'const crypto=require("node:crypto"), chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";process.stdout.write("token = "+["ghp",Array.from(crypto.randomBytes(36),b=>chars[b%chars.length]).join("")].join("_")+"\n")' | docker run --rm -i ghcr.io/gitleaks/gitleaks:v8.30.0 stdin --redact
          SCAN_RESULT=$?
          set -e
          test "$SCAN_RESULT" -eq 1
      - name: Scan repository history
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.0 git --config /repo/.gitleaks.toml --redact /repo
