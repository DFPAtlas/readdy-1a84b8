services:
  gallery-scanner:
    build: .
    container_name: vowora-gallery-scanner
    restart: unless-stopped
    env_file: .env
    volumes:
      - model-cache:/home/app/.cache/huggingface
    mem_limit: 4g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  model-cache:
